name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble web files
        run: |
          mkdir -p _site
          cp Game/index.html _site/
          touch _site/.nojekyll
          cp Game/map.json _site/
          cp Game/*.ttf _site/ 2>/dev/null || true
          cp Game/*.woff2 _site/ 2>/dev/null || true
          cp -r Game/Source _site/
          cp -r Game/Art _site/
          cp -r Game/Sound _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
